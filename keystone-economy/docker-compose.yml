# Keystone Economy — VPS dev stack: FXServer + MariaDB
# Runs headless on Linux. No GTA files or GPU required for the server.
services:
  mariadb:
    image: mariadb:11
    container_name: keystone-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: >
      --innodb-buffer-pool-size=1G
      --innodb-flush-log-at-trx-commit=2
      --max-connections=200
    volumes:
      - db-data:/var/lib/mysql
      - ./server-data/resources/[keystone]/keystone_economy/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  fxserver:
    # Community-maintained FXServer image (auto-downloads the artifact).
    # Pin a known tag in production; verify maintenance status before relying on it.
    image: spritsail/fivem:latest
    container_name: keystone-fxserver
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # oxmysql reads this connection string
      MYSQL_CONNECTION_STRING: "mysql://${DB_USER}:${DB_PASSWORD}@mariadb/${DB_NAME}"
    volumes:
      - ./server-data:/config
    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      - "40120:40120/tcp"   # txAdmin

volumes:
  db-data:

# Keystone Economy — FXServer config
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Keystone Economy — Dev"
sv_maxclients 128
set onesync on                     # required for 64+ slots / entity state

# --- Database (oxmysql reads the env connection string set in docker-compose) ---
ensure oxmysql

# --- ox base (dev target: Qbox + ox first) ---
# Download these into server-data/resources/ before first ensure:
#   oxmysql, ox_lib, ox_inventory, qbx_core ...
ensure ox_lib

# --- Keystone ---
ensure keystone_economy

# Get a free key at https://keymaster.fivem.net and paste it here:
sv_licenseKey changeme
